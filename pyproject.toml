[project]
name = "antquant"
version = "0.4.1"
description = "Self-hosted web UI for the LumiBot trading framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "lumibot==4.6.48",
    # Use the baseline runtime on x86 hosts and VMs without AVX2.
    "polars[rtcompat]>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "psutil>=5.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101", "S603", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "compat: imports the real LumiBot package (LumiBot adapter compatibility)",
    "integration: needs network access (set RUN_INTEGRATION=1)",
]
