version: 2
updates:
  # Python, including LumiBot. A LumiBot bump fails the compat job until the new
  # version is checked and added to VERIFIED_LUMIBOT_VERSIONS, so it can never
  # reach a published image untested.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      lumibot:
        patterns: ["lumibot"]
      python-deps:
        patterns: ["*"]
        exclude-patterns: ["lumibot"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
